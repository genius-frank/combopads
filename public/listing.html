<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComboPads — House Details</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0f172a; --secondary: #3b82f6; --accent: #10b981; --bg: #f8fafc; --text: #1e293b; --white: #ffffff; }
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg); color: var(--text); }
        header { background: var(--white); padding: 15px 40px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: 800; color: var(--primary); text-decoration: none; }
        .logo span { color: var(--secondary); }

        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; display: grid; grid-template-columns: 1.5fr 1fr; gap: 30px; }
        @media (max-width: 800px) { .container { grid-template-columns: 1fr; } }

        .img-box { width: 100%; height: 400px; border-radius: 24px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-bottom: 25px; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }

        .card { background: white; padding: 30px; border-radius: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid #f1f5f9; margin-bottom: 25px; }
        .price { font-size: 2rem; font-weight: 800; color: var(--accent); margin-bottom: 10px; }

        .btn { padding: 15px 30px; border-radius: 15px; border: none; font-weight: 800; cursor: pointer; transition: 0.3s; font-size: 1rem; width: 100%; margin-top: 15px; }
        .btn-p { background: var(--secondary); color: white; }

        input, textarea { width: 100%; padding: 15px; border: 1px solid #e2e8f0; border-radius: 12px; margin-bottom: 15px; outline: none; background: #f8fafc; }
    </style>
</head>
<body>
    <header><a href="index.html" class="logo">Combo<span>Pads</span></a></header>
    <div class="container" id="cnt">Loading details...</div>

    <script>
        const id = new URLSearchParams(window.location.search).get('id');
        async function load() {
            try {
                const res = await fetch('/api/listings/'+id);
                if (!res.ok) throw new Error('Not found');
                const l = await res.json();
                const photo = (l.photos && l.photos[0]) ? l.photos[0].photo_url : 'https://images.unsplash.com/photo-1560518883-ce09059eeffa?auto=format&fit=crop&w=1000&q=80';

                document.getElementById('cnt').innerHTML = `
                    <div>
                        <div class="img-box"><img src="${photo}"></div>
                        <div class="card">
                            <div class="price">KSh ${Number(l.price).toLocaleString()}</div>
                            <h1>${l.title}</h1>
                            <p style="color:#64748b; margin-top:5px;">📍 ${l.property_name} · ${l.location || ''}</p>
                            <p style="margin-top:20px;">${l.description || 'Spacious and high-quality room available.'}</p>
                        </div>
                    </div>
                    <div>
                        <div class="card" id="reg">
                            <h3>Interested? Apply Now</h3>
                            <p style="color:#64748b; margin-bottom:20px; font-size:0.9rem;">The owner will receive your message instantly.</p>
                            <input id="tn" placeholder="Full Name">
                            <input id="tp" placeholder="Phone 254...">
                            <textarea id="tm" placeholder="I am interested in this house. Is it available?"></textarea>
                            <button class="btn btn-p" onclick="send()">Submit Inquiry</button>
                        </div>
                        <div class="card" id="done" style="display:none; text-align:center;">
                            <h2 style="color:var(--accent)">Sent! 🎉</h2>
                            <p style="margin-bottom:20px;">The owner has been notified.</p>
                            <button class="btn btn-p" onclick="location.href='apply.html?id=${id}'">Proceed to Official Booking</button>
                        </div>
                    </div>
                `;
            } catch (err) {
                document.getElementById('cnt').innerHTML = `<div class="card" style="grid-column:1/-1; text-align:center;"><h2>House not found.</h2><p>Please return to the marketplace.</p><button class="btn btn-p" style="width:auto; margin-top:20px;" onclick="location.href='index.html'">Marketplace</button></div>`;
            }
        }

        async function send() {
            const b = { listingId:id, name:document.getElementById('tn').value, phone:document.getElementById('tp').value, message:document.getElementById('tm').value };
            const res = await fetch('/api/inquiries', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(b) });
            if(res.ok) { document.getElementById('reg').style.display='none'; document.getElementById('done').style.display='block'; }
        }
        load();
    </script>
</body>
</html>
