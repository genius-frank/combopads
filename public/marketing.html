<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Printable Poster — ComboPads</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #f1f5f9; padding: 40px; display: flex; flex-direction: column; align-items: center; }
        .poster { background: white; width: 210mm; height: 297mm; padding: 60px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.1); border: 20px solid #0f172a; position: relative; }
        h1 { font-size: 5rem; font-weight: 800; margin: 0; letter-spacing: -3px; color: #0f172a; }
        h1 span { color: #3b82f6; }
        .tagline { font-size: 2.5rem; font-weight: 700; color: #64748b; margin: 20px 0; }
        .qr-placeholder { width: 300px; height: 300px; border: 5px solid #0f172a; margin: 50px auto; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #3b82f6; font-size: 1.2rem; }
        .cta { font-size: 3rem; font-weight: 800; background: #3b82f6; color: white; padding: 20px 40px; border-radius: 20px; display: inline-block; margin-top: 30px; }
        .footer { position: absolute; bottom: 60px; left: 0; right: 0; font-size: 1.5rem; font-weight: 700; color: #94a3b8; }
        @media print { body { padding: 0; background: white; } .poster { box-shadow: none; border: 15px solid #0f172a; } .no-print { display: none; } }
    </style>
</head>
<body>
    <button class="no-print" onclick="window.print()" style="padding:15px 30px; background:#3b82f6; color:white; border:none; border-radius:10px; font-weight:800; cursor:pointer; margin-bottom:30px;">HIT CTRL + P TO PRINT POSTER</button>

    <div class="poster">
        <h1>Combo<span>Pads</span></h1>
        <p class="tagline">NYUMBA BILA BROKER!</p>

        <div style="margin:60px 0;">
            <p style="font-size:1.8rem; color:#1e293b; line-height:1.4;">
                Find your dream house in <strong>2 minutes.</strong><br>
                Verified Listings. No Viewing Fees.<br>
                Direct contact with Landlords.
            </p>
        </div>

        <div class="qr-placeholder">
            PASTE YOUR<br>QR CODE HERE
        </div>

        <div class="cta">SCAN TO ENTER</div>

        <div class="footer">
            www.combopads.onrender.com<br>
            Managed by Francis Empire
        </div>
    </div>
</body>
</html>
