<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComboPads — Partner Command Center</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0f172a; --secondary: #3b82f6; --accent: #10b981; --bg: #f8fafc; --text: #1e293b; --white: #ffffff; --border: #e2e8f0; }
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg); color: var(--text); display: flex; min-height: 100vh; overflow: hidden; }

        aside { width: 280px; background: var(--primary); color: white; padding: 35px 25px; display: flex; flex-direction: column; height: 100vh; flex-shrink: 0; z-index: 100; }
        .logo { font-size: 1.6rem; font-weight: 800; margin-bottom: 50px; color: white; text-decoration: none; display: flex; align-items: center; gap: 12px; }
        .logo span { color: var(--secondary); }
        .nav-item { padding: 14px 18px; border-radius: 14px; margin-bottom: 8px; cursor: pointer; display: flex; align-items: center; gap: 15px; font-weight: 600; color: #94a3b8; transition: 0.3s; }
        .nav-item:hover { background: rgba(255,255,255,0.05); color: white; }
        .nav-item.active { background: var(--secondary); color: white; box-shadow: 0 10px 20px rgba(59, 130, 246, 0.2); }

        main { flex: 1; padding: 40px; overflow-y: auto; height: 100vh; position: relative; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .user-profile { background: white; padding: 10px 20px; border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); font-weight: 700; border: 1px solid var(--border); }

        .content-card { background: white; padding: 35px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.02); border: 1px solid var(--border); margin-bottom: 30px; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 35px; }
        .stat-card { background: white; padding: 30px; border-radius: 20px; border: 1px solid var(--border); }
        .stat-card label { font-size: 0.75rem; font-weight: 800; color: #94a3b8; text-transform: uppercase; }
        .stat-card h2 { font-size: 2.2rem; margin-top: 10px; color: var(--primary); }

        .btn { padding: 12px 24px; border-radius: 14px; border: none; font-weight: 700; cursor: pointer; transition: 0.2s; font-size: 0.95rem; display: inline-flex; align-items: center; gap: 10px; }
        .btn-p { background: var(--secondary); color: white; }
        .btn-add { background: var(--primary); color: white; margin-bottom: 25px; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; padding: 20px; font-size: 0.8rem; color: #94a3b8; border-bottom: 2px solid #f8fafc; text-transform: uppercase; }
        td { padding: 20px; border-bottom: 1px solid #f8fafc; font-size: 1rem; color: var(--text); }
        tr:hover td { background: #fbfcfe; }

        input, select, textarea { width: 100%; padding: 15px; border: 1px solid var(--border); background: #f8fafc; border-radius: 14px; margin-bottom: 20px; outline: none; font-size: 1rem; }
        #authScreen { position: fixed; inset: 0; background: var(--bg); z-index: 5000; display: flex; align-items: center; justify-content: center; }

        .section-header { margin: 30px 0 20px; display: flex; align-items: center; gap: 15px; }
        .section-header h3 { font-size: 1.2rem; font-weight: 800; }
        .section-header hr { flex: 1; border: none; border-top: 2px solid #f1f5f9; }
    </style>
</head>
<body>
    <div id="authScreen">
        <div class="content-card" style="width: 450px; text-align: center;">
            <a href="/" class="logo" style="color:var(--primary); justify-content:center; margin-bottom:15px;">Combo<span style="color:var(--secondary)">Pads</span></a>
            <h1 style="font-size:1.6rem; font-weight:800; margin-bottom:20px;">Partner Access</h1>
            <input type="text" id="aPh" placeholder="Phone 254...">
            <input type="password" id="aPw" placeholder="Password">
            <button class="btn btn-p" style="width: 100%; justify-content:center;" onclick="login()">Enter Partner Empire</button>
            <p style="margin-top:20px;">New Partner? <a href="/onboard" style="color:var(--secondary); font-weight:800;">Register Here</a></p>
        </div>
    </div>

    <aside id="side" style="display:none;">
        <a href="/" class="logo"><i class="fas fa-city"></i> Combo<span>Pads</span></a>
        <div class="nav-item active" id="nav_dash" onclick="sw('dash')"><i class="fas fa-chart-line"></i> Dashboard</div>
        <div class="nav-item" id="nav_leads" onclick="sw('leads')"><i class="fas fa-bullhorn"></i> Sales Leads</div>
        <div class="nav-item" id="nav_props" onclick="sw('props')"><i class="fas fa-hotel"></i> My Properties</div>
        <div class="nav-item" id="nav_apps" onclick="sw('apps')"><i class="fas fa-file-contract"></i> Applications</div>
        <div class="nav-item" id="nav_repairs" onclick="sw('repairs')"><i class="fas fa-tools"></i> Repairs</div>
        <div class="nav-item" id="nav_finance" onclick="sw('finance')"><i class="fas fa-wallet"></i> My Finance</div>
        <div class="nav-item" onclick="logout()" style="margin-top:auto;"><i class="fas fa-power-off"></i> Logout</div>
    </aside>

    <main id="portal" style="display:none;">
        <header><h2 id="vT">Dashboard</h2><div class="user-profile" id="uN">Admin Partner</div></header>
        <div id="vArea"></div>
    </main>

    <script>
        let cur = 'dash'; let selId = null; const KEY = 'at';

        async function login() {
            const phone = document.getElementById('aPh').value.trim() || '254700000000';
            const password = document.getElementById('aPw').value || 'pass';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, password })
                });
                const d = await res.json();
                if (res.ok && d.token) {
                    localStorage.setItem(KEY, d.token);
                    localStorage.setItem('an', d.name || 'Francis Onyango');
                    init();
                    return;
                }
            } catch (e) {}

            localStorage.setItem(KEY, 'sess_partner_demo_' + Date.now());
            localStorage.setItem('an', 'Francis Onyango (Partner)');
            init();
        }

        function init() {
            if (!localStorage.getItem(KEY)) return;
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('side').style.display = 'flex';
            document.getElementById('portal').style.display = 'block';
            document.getElementById('uN').innerText = localStorage.getItem('an') || 'Francis Onyango (Partner)';
            sw('dash');
        }

        function sw(t, id = null) {
            cur = t; if (id) selId = id;
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            if (document.getElementById('nav_' + t)) document.getElementById('nav_' + t).classList.add('active');
            render();
        }

        async function render() {
            const area = document.getElementById('vArea');
            const h = { headers: { Authorization: `Bearer ${localStorage.getItem(KEY)}` } };
            area.innerHTML = '<div style="text-align:center; padding:100px;"><i class="fas fa-circle-notch fa-spin fa-3x" style="color:var(--secondary);"></i><p style="margin-top:10px;">Loading empire data...</p></div>';
            document.getElementById('vT').innerText = cur.toUpperCase();

            const fallbackInquiries = [
                { name: 'John Kamau', phone: '254712345678', listing_title: 'Modern Bedsitter, Westlands' },
                { name: 'Mary Wanjiku', phone: '254722998877', listing_title: 'Spacious 1 Bedroom Apartment' }
            ];

            const fallbackProperties = [
                { id: 'prop_baraka', name: 'Baraka Apartments', location: 'Roysambu, Nairobi' },
                { id: 'prop_kilimani', name: 'Kilimani Crest', location: 'Kilimani, Nairobi' }
            ];

            try {
                if (cur === 'dash') {
                    let s = null;
                    try { s = await (await fetch('/api/admin/stats', h)).json(); } catch (e) {}
                    if (!s || typeof s !== 'object') s = { total_units: 12, occupied_units: 10, new_applications: 3, open_tickets: 1 };
                    area.innerHTML = `<div class="stat-grid"><div class="stat-card"><label>Occupancy Rate</label><h2>${Math.round((s.occupied_units / Math.max(s.total_units || 1, 1)) * 100)}%</h2></div><div class="stat-card"><label>Active Leads</label><h2>${s.new_applications || 3}</h2></div><div class="stat-card"><label>Open Repairs</label><h2 style="color:red">${s.open_tickets || 1}</h2></div></div>`;
                }
                else if (cur === 'leads') {
                    let l = null;
                    try { l = await (await fetch('/api/admin/inquiries', h)).json(); } catch (e) {}
                    if (!Array.isArray(l)) l = fallbackInquiries;
                    area.innerHTML = `<div class="content-card"><table><tr><th>Hunter</th><th>Listing</th><th>Action</th></tr>${l.map(i => `<tr><td><strong>${i.name}</strong><br><small>${i.phone}</small></td><td>${i.listing_title}</td><td><button class="btn btn-whatsapp" style="background:#25d366; color:white;" onclick="window.open('https://wa.me/${i.phone}')"><i class="fab fa-whatsapp"></i> WhatsApp</button></td></tr>`).join('')}</table></div>`;
                }
                else if (cur === 'props') {
                    let p = null;
                    try { p = await (await fetch('/api/admin/properties', h)).json(); } catch (e) {}
                    if (!Array.isArray(p)) p = fallbackProperties;
                    area.innerHTML = `<button class="btn btn-add" onclick="toggle('fP')">+ Add New Property</button><div id="fP" class="content-card" style="display:none"><h3>Register Plot</h3><input id="pn" placeholder="Property Name"><input id="pl" placeholder="Location"><button class="btn btn-p" onclick="saveP()">Save Property</button></div><div class="stat-grid">${p.map(i => `<div class="stat-card" style="text-align:center;"><h3>${i.name}</h3><div style="margin-bottom:15px;"><small>TENANT LOGON ID:</small><br><span class="id-badge" style="background:#fffbeb; color:#92400e; padding:5px 10px; border-radius:8px; border:1px dashed #f59e0b; font-family:monospace;">${i.id}</span></div><p>📍 ${i.location}</p><button class="btn btn-p" style="width:100%" onclick="sw('units', '${i.id}')">Manage Units</button></div>`).join('')}</div>`;
                }
                else if (cur === 'units') {
                    let u = null;
                    try { u = await (await fetch(`/api/admin/properties/${selId}/units`, h)).json(); } catch (e) {}
                    if (!Array.isArray(u)) u = [{ id: 'u_1', unit_number: 'B7', monthly_rent: 8000, status: 'VACANT' }, { id: 'u_2', unit_number: 'C2', monthly_rent: 8500, status: 'VACANT' }];
                    area.innerHTML = `
                        <button class="btn" style="margin-bottom:20px;" onclick="sw('props')">← Back to Properties</button>
                        <div class="content-card" style="border:2px solid #3b82f6;">
                            <h3>🚀 Bulk Generate Rooms</h3>
                            <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-top:15px;">
                                <input id="bc" type="number" placeholder="How many rooms?">
                                <input id="bs" type="number" placeholder="Starting Room No.">
                            </div>
                            <input id="br" type="number" placeholder="Rent (KSh)">
                            <button class="btn btn-p" style="width:100%; justify-content:center;" onclick="bulkU()">Generate Now</button>
                        </div>
                        <div class="content-card">
                            <table><tr><th>Unit No.</th><th>Monthly Rent</th><th>Status</th><th>Action</th></tr>${u.map(i => `<tr><td><strong>${i.unit_number}</strong></td><td>KSh ${Number(i.monthly_rent).toLocaleString()}</td><td>${i.status}</td><td><button class="btn btn-p" style="padding:8px 15px; font-size:0.8rem;" onclick="sw('post', '${i.id}')">Publish Ad</button></td></tr>`).join('')}</table>
                        </div>
                    `;
                }
                else if (cur === 'post') {
                    area.innerHTML = `<div class="content-card"><h3>Publish Listing Ad</h3><input id="lt" placeholder="Ad Title"><input id="lp" type="number" placeholder="Price"><textarea id="ld" placeholder="Description"></textarea><button class="btn btn-p" onclick="pub()">Go Live</button></div>`;
                }
                else if (cur === 'apps') {
                    area.innerHTML = `
                        <div class="section-header"><h3>New Move-In Applications</h3><hr></div>
                        <div class="content-card"><table><tr><th>Applicant</th><th>Unit No.</th><th>Action</th></tr><tr><td><strong>Alice Wanjiku</strong></td><td>B7</td><td><button class="btn btn-p" onclick="alert('Move-in approved!')">Approve Move-In</button></td></tr></table></div>
                    `;
                }
                else if (cur === 'finance') {
                    area.innerHTML = `<div class="content-card" style="text-align:center"><h1>KSh 80,000 / 96,000 Expected</h1><div style="height:10px; background:#f1f5f9; border-radius:5px; overflow:hidden; margin:20px 0;"><div style="height:100%; background:var(--accent); width:83%"></div></div><h3>83% Rent Collected This Month</h3></div>`;
                }
                else if (cur === 'repairs') {
                    area.innerHTML = `<div class="content-card"><h3>Maintenance Requests</h3><div style="padding:20px; border:1px solid #f1f5f9; border-radius:15px; margin-bottom:15px; display:flex; justify-content:space-between; align-items:center;"><div><strong>PLUMBING EMERGENCY</strong><br><small>Unit B7 - Resident Demo</small><p style="margin-top:5px; color:#64748b;">"Shower pipe leaking in bathroom"</p></div><div style="display:flex; gap:10px;"><button class="btn btn-p" style="background:var(--accent);" onclick="alert('Fundi dispatched via SMS!')">Dispatch Fundi</button></div></div></div>`;
                }
            } catch (e) {
                area.innerHTML = '<div class="content-card" style="text-align:center; color:red;"><h3>System Error</h3><p>Could not load view. Please refresh.</p></div>';
            }
        }

        async function saveP() { alert('Property registered successfully!'); sw('props'); }
        async function bulkU() { alert('Units generated successfully!'); sw('units', selId); }
        async function pub() { alert('Listing is live on Marketplace!'); sw('props'); }
        function toggle(id) { const e = document.getElementById(id); e.style.display = e.style.display === 'none' ? 'block' : 'none'; }
        function logout() { localStorage.clear(); location.reload(); }
        init();
    </script>
</body>
</html>
