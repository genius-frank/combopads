<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComboPads — Partner Command Center</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #0f172a; --secondary: #3b82f6; --accent: #10b981; --bg: #f8fafc; --text: #1e293b; --white: #ffffff; --border: #e2e8f0; }
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg); color: var(--text); display: flex; min-height: 100vh; overflow: hidden; }

        aside { width: 280px; background: var(--primary); color: white; padding: 35px 25px; display: flex; flex-direction: column; height: 100vh; flex-shrink: 0; z-index: 100; }
        .logo { font-size: 1.6rem; font-weight: 800; margin-bottom: 50px; color: white; text-decoration: none; display: flex; align-items: center; gap: 12px; }
        .logo span { color: var(--secondary); }
        .nav-item { padding: 14px 18px; border-radius: 14px; margin-bottom: 8px; cursor: pointer; display: flex; align-items: center; gap: 15px; font-weight: 600; color: #94a3b8; transition: 0.3s; }
        .nav-item:hover { background: rgba(255,255,255,0.05); color: white; }
        .nav-item.active { background: var(--secondary); color: white; box-shadow: 0 10px 20px rgba(59, 130, 246, 0.2); }

        main { flex: 1; padding: 40px; overflow-y: auto; height: 100vh; position: relative; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .user-profile { background: white; padding: 10px 20px; border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); font-weight: 700; border: 1px solid var(--border); }

        .content-card { background: white; padding: 35px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.02); border: 1px solid var(--border); margin-bottom: 30px; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 25px; margin-bottom: 35px; }
        .stat-card { background: white; padding: 30px; border-radius: 20px; border: 1px solid var(--border); position: relative; overflow: hidden; }
        .stat-card label { font-size: 0.75rem; font-weight: 800; color: #94a3b8; text-transform: uppercase; }
        .stat-card h2 { font-size: 2.5rem; margin-top: 10px; color: var(--primary); }
        .stat-card .chart-mini { position: absolute; bottom: 0; left: 0; width: 100%; height: 60px; opacity: 0.2; }

        .btn { padding: 14px 24px; border-radius: 14px; border: none; font-weight: 700; cursor: pointer; transition: 0.3s; font-size: 0.95rem; display: inline-flex; align-items: center; gap: 10px; }
        .btn-p { background: var(--secondary); color: white; }
        .btn-p:hover { transform: translateY(-2px); background: #2563eb; }
        .btn-add { background: var(--primary); color: white; margin-bottom: 25px; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; padding: 20px; font-size: 0.8rem; color: #94a3b8; border-bottom: 2px solid #f8fafc; text-transform: uppercase; }
        td { padding: 20px; border-bottom: 1px solid #f8fafc; font-size: 1rem; color: var(--text); }

        input, select, textarea { width: 100%; padding: 15px; border: 1px solid var(--border); background: #f8fafc; border-radius: 14px; margin-bottom: 20px; outline: none; font-size: 1rem; }
        #authScreen { position: fixed; inset: 0; background: var(--bg); z-index: 5000; display: flex; align-items: center; justify-content: center; }

        .id-badge { background: #fff7ed; color: #c2410c; padding: 8px 15px; border-radius: 10px; font-family: monospace; font-weight: 800; font-size: 0.9rem; border: 1px dashed #f59e0b; display: inline-block; margin-top: 10px; }
        .verified-badge { color: var(--accent); font-weight: 800; font-size: 0.8rem; display: flex; align-items: center; gap: 5px; }
    </style>
</head>
<body>
    <div id="authScreen">
        <div class="content-card" style="width: 450px; text-align: center;">
            <h1>Partner Access</h1>
            <input type="text" id="aPh" placeholder="Phone 254...">
            <input type="password" id="aPw" placeholder="Password">
            <button class="btn btn-p" style="width: 100%; justify-content:center;" onclick="login()">Enter the Empire</button>
            <p style="margin-top:20px;">New? <a href="onboard.html" style="color:var(--secondary); font-weight:800;">Register Here</a></p>
        </div>
    </div>

    <aside id="side" style="display:none;">
        <a href="index.html" class="logo"><i class="fas fa-city"></i> Combo<span>Pads</span></a>
        <div class="nav-item active" id="nav_dash" onclick="go('dash')"><i class="fas fa-chart-line"></i> Dashboard</div>
        <div class="nav-item" id="nav_leads" onclick="go('leads')"><i class="fas fa-bullhorn"></i> Leads</div>
        <div class="nav-item" id="nav_props" onclick="go('props')"><i class="fas fa-hotel"></i> Properties</div>
        <div class="nav-item" id="nav_apps" onclick="go('apps')"><i class="fas fa-file-contract"></i> Applications</div>
        <div class="nav-item" id="nav_finance" onclick="go('finance')"><i class="fas fa-wallet"></i> Finance</div>
        <div class="nav-item" onclick="logout()" style="margin-top:auto;"><i class="fas fa-power-off"></i> Logout</div>
    </aside>

    <main id="portal" style="display:none;">
        <header><h2 id="vT">Dashboard</h2><div class="user-profile" id="uN">Admin</div></header>
        <div id="vArea"></div>
    </main>

    <script>
        let cur = 'dash'; let selId = null; const KEY = 'at';

        async function login() {
            const b = { phone:document.getElementById('aPh').value.trim(), password:document.getElementById('aPw').value };
            const res = await fetch('/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(b) });
            const d = await res.json();
            if(res.ok) { localStorage.setItem(KEY, d.token); localStorage.setItem('an', d.name); init(); }
            else alert('Invalid Login: ' + d.error);
        }

        function init() {
            if(!localStorage.getItem(KEY)) return;
            document.getElementById('authScreen').style.display='none';
            document.getElementById('side').style.display='flex';
            document.getElementById('portal').style.display='block';
            document.getElementById('uN').innerText = localStorage.getItem('an');
            go('dash');
        }

        function go(v, id = null) {
            cur = v; if(id) selId = id;
            document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
            if(document.getElementById('nav_'+v)) document.getElementById('nav_'+v).classList.add('active');
            render();
        }

        async function render() {
            const area = document.getElementById('vArea');
            const h = { headers: { Authorization: `Bearer ${localStorage.getItem(KEY)}` } };
            area.innerHTML = '<div style="text-align:center; padding:100px;"><i class="fas fa-circle-notch fa-spin fa-3x" style="color:var(--secondary);"></i></div>';
            document.getElementById('vT').innerText = cur.toUpperCase();

            try {
                if(cur === 'dash') {
                    const s = await (await fetch('/api/admin/stats', h)).json();
                    const pRev = s.potential_revenue || 0;
                    const aRev = s.actual_revenue || 0;
                    const revPct = pRev > 0 ? Math.round((aRev/pRev)*100) : 0;

                    area.innerHTML = `
                        <div class="stat-grid">
                            <div class="stat-card"><label>Occupancy</label><h2>${Math.round((s.occupied_units/s.total_units)*100)||0}%</h2></div>
                            <div class="stat-card"><label>Leads</label><h2>${s.new_applications||0}</h2></div>
                            <div class="stat-card" style="border-color:var(--accent);"><label>Revenue Pulse</label><h2>${revPct}%</h2></div>
                        </div>
                        <div class="content-card">
                            <h3>Revenue Potential (Growth Analytics)</h3>
                            <canvas id="revChart" style="margin-top:20px; max-height:300px;"></canvas>
                        </div>
                    `;

                    new Chart(document.getElementById('revChart'), {
                        type: 'bar',
                        data: {
                            labels: ['Current Revenue', 'Potential (100% Full)'],
                            datasets: [{
                                label: 'Monthly KSh',
                                data: [aRev, pRev],
                                backgroundColor: ['#3b82f6', '#10b981'],
                                borderRadius: 10
                            }]
                        },
                        options: { responsive: true, plugins: { legend: { display: false } } }
                    });
                }
                else if(cur === 'leads') {
                    const l = await (await fetch('/api/admin/inquiries', h)).json();
                    area.innerHTML = `<div class="content-card"><table><tr><th>Hunter</th><th>Listing</th><th>Action</th></tr>${l.map(i=>`<tr><td><strong>${i.name}</strong><br><small>${i.phone}</small></td><td>${i.listing_title}</td><td><button class="btn btn-p" onclick="window.open('https://wa.me/${i.phone}')">WhatsApp</button></td></tr>`).join('') || '<tr><td colspan="3" style="text-align:center; padding:50px;">No leads yet.</td></tr>'}</table></div>`;
                }
                else if(cur === 'props') {
                    const p = await (await fetch('/api/admin/properties', h)).json();
                    area.innerHTML = `
                        <button class="btn btn-add" onclick="toggle('fP')">+ Add Property</button>
                        <div id="fP" class="content-card" style="display:none"><h3>Register Plot</h3><input id="pn" placeholder="Name"><input id="pl" placeholder="Location"><button class="btn btn-p" onclick="saveP()">Save</button></div>
                        <div class="stat-grid">${p.map(i=>`
                            <div class="stat-card" style="text-align:center;">
                                <h3>${i.name}</h3>
                                ${i.is_verified ? '<div class="verified-badge"><i class="fas fa-check-circle"></i> GOLD VERIFIED</div>' : ''}
                                <div style="margin-bottom:15px;"><small>TENANT LOGON ID:</small><br><span class="id-badge">${i.id}</span></div>
                                <p>📍 ${i.location}</p>
                                <button class="btn btn-p" style="width:100%" onclick="go('units', '${i.id}')">Manage Units</button>
                            </div>
                        `).join('')}</div>`;
                }
                else if(cur === 'units') {
                    const u = await (await fetch(`/api/admin/properties/${selId}/units`, h)).json();
                    area.innerHTML = `
                        <button class="btn" style="margin-bottom:20px;" onclick="go('props')">← Back</button>
                        <div class="content-card" style="border:2px solid #3b82f6;">
                            <h3>🚀 Bulk Generate Rooms</h3>
                            <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-top:15px;">
                                <input id="bc" type="number" placeholder="How many rooms?">
                                <input id="bs" type="number" placeholder="Starting Room No.">
                            </div>
                            <input id="br" type="number" placeholder="Rent (KSh)">
                            <button class="btn btn-p" style="width:100%; justify-content:center;" onclick="bulkU()">Generate Now</button>
                        </div>
                        <div class="content-card">
                            <h3>🚀 Bulk List to Marketplace</h3>
                            <p style="margin-bottom:15px; color:#64748b;">Describe one room type to represent ALL vacant rooms.</p>
                            <input id="blTitle" placeholder="Market Ad Title (e.g. Spacious Studio)">
                            <input id="blPrice" type="number" placeholder="Display Price (KSh)">
                            <textarea id="blDesc" placeholder="Description for all units..."></textarea>
                            <button class="btn btn-p" onclick="bulkList()">Post All Vacant to Market</button>
                        </div>
                        <div class="content-card">
                            <table><tr><th>No.</th><th>Rent</th><th>Status</th><th>Action</th></tr>${u.map(i=>`<tr><td><strong>${i.unit_number}</strong></td><td>KSh ${Number(i.monthly_rent).toLocaleString()}</td><td>${i.status}</td><td><button class="btn btn-p" style="padding:8px 15px; font-size:0.8rem;" onclick="go('post', '${i.id}')">Post</button></td></tr>`).join('')}</table>
                        </div>
                    `;
                }
            } catch(e) { area.innerHTML = '<div class="content-card" style="text-align:center; color:red;"><h3>System Error</h3><p>Could not load view. Please refresh.</p></div>'; }
        }

        async function saveP() { await fetch('/api/admin/properties', { method:'POST', headers:{'Content-Type':'application/json', Authorization:`Bearer ${localStorage.getItem(KEY)}`}, body:JSON.stringify({name:document.getElementById('pn').value, location:document.getElementById('pl').value})}); go('props'); }
        async function bulkU() { await fetch(`/api/admin/properties/${selId}/bulk-units`, { method:'POST', headers:{'Content-Type':'application/json', Authorization:`Bearer ${localStorage.getItem(KEY)}`}, body:JSON.stringify({count:document.getElementById('bc').value, startNumber:document.getElementById('bs').value, rent:document.getElementById('br').value})}); alert('Generated!'); go('units', selId); }
        async function bulkList() { await fetch(`/api/admin/property/${selId}/bulk-list`, { method:'POST', headers:{'Content-Type':'application/json', Authorization:`Bearer ${localStorage.getItem(KEY)}`}, body:JSON.stringify({title:document.getElementById('blTitle').value, price:document.getElementById('blPrice').value, description:document.getElementById('blDesc').value})}); alert('All vacant rooms are now LIVE!'); go('props'); }
        function toggle(id) { const e=document.getElementById(id); e.style.display=e.style.display==='none'?'block':'none'; }
        function logout() { localStorage.clear(); location.reload(); }
        init();
    </script>
</body>
</html>
